<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reddit Sentiment Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span.dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #3fb950;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .meta {
      font-size: 0.8rem;
      color: #8b949e;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 32px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px 20px;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #e6edf3;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #30363d;
      background: transparent;
      color: #8b949e;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: #21262d;
      color: #e6edf3;
      border-color: #58a6ff;
    }

    .filter-btn.active {
      color: #58a6ff;
    }

    .chart-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .chart-container h2 {
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .chart-wrapper {
      height: 200px;
    }

    .table-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      border-bottom: 1px solid #30363d;
    }

    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b949e;
      font-weight: 600;
    }

    tbody tr {
      border-bottom: 1px solid #21262d;
      transition: background 0.1s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #1c2128;
    }

    tbody td {
      padding: 12px 16px;
      font-size: 0.9rem;
    }

    .rank {
      color: #8b949e;
      font-size: 0.8rem;
      width: 40px;
    }

    .ticker {
      font-weight: 700;
      font-size: 1rem;
      color: #58a6ff;
      font-family: monospace;
    }

    .name {
      color: #8b949e;
      font-size: 0.85rem;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-stock {
      background: rgba(88, 166, 255, 0.15);
      color: #58a6ff;
      border: 1px solid rgba(88, 166, 255, 0.3);
    }

    .badge-crypto {
      background: rgba(210, 153, 34, 0.15);
      color: #e3b341;
      border: 1px solid rgba(210, 153, 34, 0.3);
    }

    .mentions {
      font-weight: 600;
      color: #e6edf3;
    }

    .bar-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-bg {
      flex: 1;
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      min-width: 80px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: #58a6ff;
      transition: width 0.5s ease;
    }

    .trend {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .trend-up { color: #3fb950; }
    .trend-down { color: #f85149; }
    .trend-neutral { color: #8b949e; }

    .trend-icon { font-size: 0.9rem; }

    .loading {
      text-align: center;
      padding: 60px;
      color: #8b949e;
    }

    .loading .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: 8px;
      padding: 16px 20px;
      color: #f85149;
      margin-bottom: 20px;
      display: none;
    }

    .refresh-btn {
      padding: 6px 14px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    .refresh-btn:hover {
      background: #30363d;
      color: #e6edf3;
    }

    @media (max-width: 768px) {
      header { padding: 12px 16px; }
      .container { padding: 16px; }
      .col-bar, .col-prev { display: none; }
      thead th:nth-child(5), tbody td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>
    <span class="dot"></span>
    Reddit Sentiment Tracker
  </h1>
  <div class="meta" id="last-updated">Wird geladen...</div>
</header>

<div class="container">

  <div class="error-box" id="error-box">
    Fehler beim Laden der Daten. Bitte Seite neu laden.
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="label">Assets getrackt</div>
      <div class="value" id="stat-count">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Top Aktie heute</div>
      <div class="value" id="stat-top-stock" style="font-size:1.1rem">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Top Krypto heute</div>
      <div class="value" id="stat-top-crypto" style="font-size:1.1rem">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Quellen</div>
      <div class="value" style="font-size:1rem; color:#8b949e">11 Subreddits</div>
    </div>
  </div>

  <div class="chart-container">
    <h2>Top 10 Erwähnungen (letzte 24h)</h2>
    <div class="chart-wrapper">
      <canvas id="mentionsChart"></canvas>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">Alle</button>
    <button class="filter-btn" onclick="setFilter('stock', this)">Aktien</button>
    <button class="filter-btn" onclick="setFilter('crypto', this)">Krypto</button>
    <button class="filter-btn" onclick="setFilter('up', this)">↑ Trending up</button>
    <div style="margin-left:auto">
      <button class="refresh-btn" onclick="loadData()">↻ Neu laden</button>
    </div>
  </div>

  <div class="table-container">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Daten werden geladen...
    </div>
    <table id="main-table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Ticker</th>
          <th>Typ</th>
          <th>Erwähnungen (24h)</th>
          <th class="col-bar">Anteil</th>
          <th>Trend vs. gestern</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

</div>

<script>
  let allData = [];
  let currentFilter = 'all';
  let chart = null;

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable(allData);
  }

  function formatNumber(n) {
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return n.toString();
  }

  function trendHTML(item) {
    if (item.trend === 'up') {
      return `<span class="trend trend-up">▲ +${item.change_pct}%</span>`;
    } else if (item.trend === 'down') {
      return `<span class="trend trend-down">▼ ${item.change_pct}%</span>`;
    } else {
      if (item.prev_mentions === 0) {
        return `<span class="trend trend-neutral">— Neu</span>`;
      }
      return `<span class="trend trend-neutral">→ ${item.change_pct > 0 ? '+' : ''}${item.change_pct}%</span>`;
    }
  }

  function renderTable(data) {
    let filtered = data;
    if (currentFilter === 'stock') filtered = data.filter(d => d.type === 'stock');
    else if (currentFilter === 'crypto') filtered = data.filter(d => d.type === 'crypto');
    else if (currentFilter === 'up') filtered = data.filter(d => d.trend === 'up');

    const maxMentions = filtered.length > 0 ? filtered[0].mentions : 1;
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#8b949e">Keine Daten für diesen Filter</td></tr>';
      return;
    }

    filtered.forEach((item, i) => {
      const pct = Math.round((item.mentions / maxMentions) * 100);
      const badgeClass = item.type === 'stock' ? 'badge-stock' : 'badge-crypto';
      const badgeLabel = item.type === 'stock' ? 'Aktie' : 'Krypto';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="rank">${i + 1}</td>
        <td>
          <div class="ticker">${item.ticker}</div>
          <div class="name">${item.name}</div>
        </td>
        <td><span class="badge ${badgeClass}">${badgeLabel}</span></td>
        <td><span class="mentions">${formatNumber(item.mentions)}</span></td>
        <td class="col-bar">
          <div class="bar-wrapper">
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
          </div>
        </td>
        <td>${trendHTML(item)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function renderChart(data) {
    const top10 = data.slice(0, 10);
    const labels = top10.map(d => d.ticker);
    const values = top10.map(d => d.mentions);
    const colors = top10.map(d => d.type === 'stock' ? '#58a6ff' : '#e3b341');

    if (chart) chart.destroy();

    const ctx = document.getElementById('mentionsChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderRadius: 4,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => ` ${ctx.raw} Erwähnungen`,
            }
          }
        },
        scales: {
          x: {
            grid: { color: '#21262d' },
            ticks: { color: '#8b949e', font: { size: 11 } },
          },
          y: {
            grid: { color: '#21262d' },
            ticks: { color: '#8b949e', font: { size: 11 } },
          }
        }
      }
    });
  }

  function updateStats(data) {
    document.getElementById('stat-count').textContent = data.count;

    const topStock = data.assets.find(d => d.type === 'stock');
    const topCrypto = data.assets.find(d => d.type === 'crypto');

    document.getElementById('stat-top-stock').textContent =
      topStock ? `${topStock.ticker} (${formatNumber(topStock.mentions)})` : '—';
    document.getElementById('stat-top-crypto').textContent =
      topCrypto ? `${topCrypto.ticker} (${formatNumber(topCrypto.mentions)})` : '—';

    if (data.last_scraped) {
      const d = new Date(data.last_scraped + 'Z');
      document.getElementById('last-updated').textContent =
        'Zuletzt aktualisiert: ' + d.toLocaleString('de-DE');
    }
  }

  async function loadData() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('main-table').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';

    try {
      const resp = await fetch('/api/trending');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();

      allData = data.assets;
      updateStats(data);
      renderChart(allData);
      renderTable(allData);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-table').style.display = 'table';
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-box').style.display = 'block';
      console.error(e);
    }
  }

  // Auto-refresh every 10 minutes
  loadData();
  setInterval(loadData, 10 * 60 * 1000);
</script>

</body>
</html>
